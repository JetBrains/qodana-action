name: Sync branches main with latest

on:
  push:
    branches:
      - main

jobs:
  sync-branch:
    name: Update latest branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast-forward latest to main
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/latest" -f sha="$GITHUB_SHA" -F force=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
